<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Alleen eigen bestanden, en verbinding alleen met GitHub (voor de telefoon). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Mealplanning</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icoon-180.png">
  <meta name="apple-mobile-web-app-title" content="Mealplanning">
  <meta name="theme-color" content="#2f6b4f">
  <link rel="stylesheet" href="css/stijl.css">
</head>
<body>
  <header class="balk">
    <a class="logo" href="#/">Mealplanning</a>
    <!-- Laptop: alle tabs naast elkaar. Telefoon: balk onderaan met de eerste vier + "Meer".
         De iconen (data-ik) zet main.js erin. -->
    <nav class="hoofdnav">
      <a href="#/" data-nav="menu" data-ik="utensils" title="Wat eten we?"><span>Eten</span></a>
      <a href="#/boodschappen" data-nav="boodschappen" data-ik="shopping-cart" title="Boodschappen"><span>Boodschappen</span><span class="nav-tel" id="nav-tel"></span></a>
      <a href="#/voorraad" data-nav="voorraad" data-ik="package" title="Voorraad"><span>Voorraad</span></a>
      <a href="#/recepten" data-nav="recepten" data-ik="book-open" title="Recepten"><span>Recepten</span></a>
      <a class="breed" href="#/logboek" data-nav="logboek" data-ik="chart-column" title="Logboek"><span>Logboek</span></a>
      <a class="breed" href="#/ingredienten" data-nav="ingredienten" data-ik="carrot" title="Ingrediënten"><span>Ingrediënten</span></a>
      <a class="breed" href="#/telefoon" data-nav="telefoon" data-ik="smartphone" title="Telefoon"><span>Telefoon</span></a>
      <details class="meer smal">
        <summary data-ik="ellipsis"><span>Meer</span></summary>
        <div class="meer-paneel">
          <a href="#/logboek" data-nav="logboek" data-ik="chart-column"><span>Logboek</span></a>
          <a href="#/ingredienten" data-nav="ingredienten" data-ik="carrot"><span>Ingrediënten</span></a>
          <a href="#/telefoon" data-nav="telefoon" data-ik="smartphone"><span>Telefoon</span></a>
        </div>
      </details>
    </nav>
  </header>
  <div id="verbinding" hidden></div>
  <div id="problemen"></div>
  <main></main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
